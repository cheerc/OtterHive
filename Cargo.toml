[package]
name = "otterhive"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"

[dependencies]
alacritty_terminal = "0.26"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
